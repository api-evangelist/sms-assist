- date: '2026-07-07'
  surface: client
  breaking: false
  highlights:
  - Added GraphQL mutation `createWorkOrder` to create a recurrent work order.
  - Added recurrent work order webhook topics 302 (Status Changed), 303 (Schedule
    Changed), 304 (Service Combination Updated), 305 (Check-In/Out Time Changed).
- date: '2026-06-23'
  surface: client
  breaking: false
  highlights:
  - Added GraphQL mutation `updateWorkOrder` for recurrent work order customer
    reference number and access information.
- date: '2026-06-09'
  surface: client
  breaking: false
  highlights:
  - Added `smeNotes` to the query proposal API.
  - Added recurrent work order Created webhook topic 300 (with CreateMonth).
  - Added GraphQL query `recurrentWorkOrders` with filter/sort/pagination.
- date: '2026-06-09'
  surface: vendor
  breaking: false
  highlights:
  - New `GET /api/v2.0/communication/messages/{messageId}` message-detail API
    (tenant-scoped; 404 on cross-tenant access).
  - Documentation enrichment for location asset details APIs (qrCode,
    installationDate fields).
- date: '2026-05-26'
  surface: vendor
  breaking: false
  highlights:
  - Added `CreatedBy` (IdName) to New Message webhook topic 1.
  - New `GET /asset/location-asset/paged-list` API.
  - New `GET /asset/location-asset/reactive/{workOrderId}/asset-details` API.
- date: '2026-05-12'
  surface: vendor
  breaking: false
  highlights:
  - Added vendor webhook topics 114 (Reactive WO Asset Added) and 115 (Reactive
    WO Asset Removed).
- date: '2026-05-12'
  surface: client
  breaking: false
  highlights:
  - Added `reactiveWorkOrderCommunication` and `reactiveWorkOrderCancelReasons`
    queries.
  - Invoice query API limited to work orders created within the last 2 years.
- date: '2025-12'
  surface: vendor
  breaking: true
