aid: sms-assist
name: SMS Assist
description: >-
  SMS Assist (rebranded as Lessen) is a facilities maintenance, repair, and
  work-order management company. Its "One" Platform coordinates reactive and
  recurrent maintenance, turn/renovation projects, invoices, proposals, assets,
  and a nationwide vendor network for residential and commercial properties.
  Lessen exposes the platform through the One Open API v2 — a GraphQL API split
  into a Client surface (property owners/managers create and track work orders,
  residents, locations, invoices, and Turn/Reno projects) and a Vendor surface
  (affiliate technicians manage assets, communications, and work orders) — plus
  a rich webhook event catalog, SSO/SCIM provisioning, and isolated sandbox and
  production environments. The legacy REST Open API v1 and Affiliate API v1 were
  sunset in favor of the v2 GraphQL platform.
