apis:
- name: One Open API v2 - Client
  description: >-
    GraphQL API for clients (property owners and managers) to create and track
    reactive and recurrent work orders, residents, locations, service requests,
    invoices, proposals, Turn/Reno projects, ratings, and attachments across the
    Lessen One Platform. Authentication is token-based: obtain a bearer
    access_token from the /one-graph-client/token endpoint via HTTP Basic Auth.
  humanURL: https://developers.lessen.com/docs/#/client/overview
  baseURL: https://meshlive.lessen.com/one-graph-client/graphql
  properties:
  - type: GraphQL
    url: https://meshlive.lessen.com/one-graph-client/graphql
  - type: Documentation
    url: https://developers.lessen.com/docs/#/client/overview
  - type: Sandbox
    url: https://meshstage.lessen.com/one-graph-client/graphql
  - type: Console
    url: https://meshstage.lessen.com/one-graph-client/ui/graphiql
- name: One Open API v2 - Vendor
  description: >-
    GraphQL/HTTP API for vendors and affiliate technicians to manage assets
    (service and location assets), attachments, communications and messages,
    client lists, employees, locations, reactive and recurrent work orders, and
    invoices on the Lessen One Platform. Token-based auth via the
    /one-graph-vendor/token endpoint (HTTP Basic Auth to a bearer access_token).
  humanURL: https://developers.lessen.com/docs/#/vendor/overview
  baseURL: https://meshlive.lessen.com/one-graph-vendor/graphql
  properties:
  - type: GraphQL
    url: https://meshlive.lessen.com/one-graph-vendor/graphql
  - type: Documentation
